name: "Parse Benchmark Logs"
description: "Parse benchmark logs and generate JSON payload"
inputs:
  job:
    description: "Job name (e.g., rucio, eventloop-columnar, evnt-native)"
    required: true
  log-file:
    description: "Path to log file"
    required: true
  log-type:
    description:
      "Type of log parser to use (e.g., rucio, athena, coffea, eventloop,
      fastframes)"
    required: true
  cluster:
    description: "Cluster name (e.g., UC-AF, SLAC-AF, BNL-AF)"
    required: true
  kibana-token:
    description: "Token for benchmark identification"
    required: true
  kibana-kind:
    description: "Kind for benchmark identification"
    required: true
  host:
    description: "Hostname to identify the machine running the job"
    required: true
  payload-file:
    description: "Path to payload file for size calculation (optional)"
    required: false
    default: ""
  os:
    description: "Operating system (centos7 or alma9)"
    required: true
  mode:
    description: "Job mode (batch or interactive)"
    required: true
  containerized:
    description: "Whether job runs in setupATLAS -c container (true/false)"
    required: true
  output-file:
    description: "Output JSON file path"
    required: false
    default: "payload.json"

outputs:
  payload-file:
    description: "Path to the generated payload JSON file"
    value: ${{ inputs.output-file }}

runs:
  using: "composite"
  steps:
    - name: Setup pixi
      uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
      with:
        pixi-version: v0.49.0
        environments: kibana

    - name: Parse log file
      shell: bash
      env:
        JOB: ${{ inputs.job }}
        LOG_FILE: ${{ inputs.log-file }}
        LOG_TYPE: ${{ inputs.log-type }}
        CLUSTER: ${{ inputs.cluster }}
        KIBANA_TOKEN: ${{ inputs.kibana-token }}
        KIBANA_KIND: ${{ inputs.kibana-kind }}
        HOST: ${{ inputs.host }}
        PAYLOAD_FILE: ${{ inputs.payload-file }}
        OS: ${{ inputs.os }}
        MODE: ${{ inputs.mode }}
        CONTAINERIZED: ${{ inputs.containerized }}
        OUTPUT_FILE: ${{ inputs.output-file }}
      run: |
        pixi run -e kibana python -m parsing.scripts.ci_parse \
          --job "$JOB" \
          --log-file "$LOG_FILE" \
          --log-type "$LOG_TYPE" \
          --cluster "$CLUSTER" \
          --token "$KIBANA_TOKEN" \
          --kind "$KIBANA_KIND" \
          --host "$HOST" \
          --payload-file "$PAYLOAD_FILE" \
          --os "$OS" \
          --mode "$MODE" \
          --containerized "$CONTAINERIZED" \
          --output "$OUTPUT_FILE"
