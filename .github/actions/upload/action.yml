name: "Upload to Kibana"
description: "Upload JSON payload to LogStash/Kibana"
inputs:
  payload-file:
    description: "Path to JSON payload file"
    required: true
  kibana-uri:
    description: "LogStash/Kibana URI endpoint"
    required: true

runs:
  using: "composite"
  steps:
    - name: Validate payload file
      shell: bash
      env:
        PAYLOAD_FILE: ${{ inputs.payload-file }}
      run: |
        if [ ! -f "$PAYLOAD_FILE" ]; then
          echo "Error: Payload file not found: $PAYLOAD_FILE"
          exit 1
        fi
        echo "Payload file found: $PAYLOAD_FILE"
        echo "::group::File contents"
        cat "$PAYLOAD_FILE" || true
        printf "\n"
        echo "::endgroup::"

    - name: Upload to LogStash
      shell: bash
      env:
        PAYLOAD_FILE: ${{ inputs.payload-file }}
        KIBANA_URI: ${{ inputs.kibana-uri }}
      run: |
        response=$(curl -X POST "$KIBANA_URI" \
          -H "Content-Type: application/json" \
          -d @"$PAYLOAD_FILE" \
          -w "%{http_code}" \
          -s -o response.txt)

        echo "HTTP Response Code: $response"
        echo "::group::Response body"
        cat response.txt || true
        printf "\n"
        echo "::endgroup::"

        if [[ ! "$response" =~ ^2 ]]; then
          echo "Upload failed with HTTP status: $response"
          exit 1
        fi

        echo "Upload successful!"
