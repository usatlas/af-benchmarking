name: uc-odf
on:
  # Manual only for now. The pull_request and schedule triggers that
  # uchicago.yml has can be added here once a manual run has passed.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Locations on the runner's persistent /data/af-benchmarking volume: the ntuples
# are staged there and FastFrames is built there
env:
  NTUPLE_DIR: /data/af-benchmarking/mc20e_ntuples
  FF_DIR: /data/af-benchmarking/FastFramesTutorial

jobs:
  rucio:
    if:
      github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.fork == false)
    runs-on: arc-runner-set-odf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Export node name
        run: echo "NODE_NAME=$NODE_NAME" >> "$GITHUB_ENV"

      - uses: $/.github/actions/setup-globus
        with:
          voms-usercert: ${{ secrets.VOMS_USERCERT }}
          voms-userkey: ${{ secrets.VOMS_USERKEY }}

      # The odf case of rucio_script.sh reads the VOMS password from a file in
      # its job directory, not from the environment
      - name: write VOMS password file
        run: |
          mkdir -p ~/af_benchmarking/rucio
          printf '%s' "$VOMS_PASSWORD" > ~/af_benchmarking/rucio/pass.txt
          chmod 600 ~/af_benchmarking/rucio/pass.txt
        shell: bash
        env:
          VOMS_PASSWORD: ${{ secrets.VOMS_PASSWORD }}

      - name: execute
        run: ./Rucio/rucio_script.sh odf
        shell: bash

      # The odf case writes its log into a timestamped directory
      - name: locate rucio log
        if: always()
        run:
          cp "$(ls -td ~/af_benchmarking/rucio/logs/*/ | head -1)rucio.log"
          rucio.log
        shell: bash

      - name: parse benchmark log
        if: always()
        uses: $/.github/actions/parse
        with:
          job: rucio
          log-file: rucio.log
          log-type: rucio
          cluster: UC-ODF
          kibana-token: ${{ secrets.KIBANA_TOKEN || 'default-token' }}
          kibana-kind: "benchmark"
          host: ${{ env.NODE_NAME }}
          os: alma9
          mode: batch
          containerized: "true"

      - name: upload to kibana
        if: always() && github.event_name != 'pull_request'
        uses: $/.github/actions/upload
        with:
          payload-file: payload.json
          kibana-uri: ${{ secrets.KIBANA_URI }}

      - name: upload log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.job }}-logs
          path: |
            rucio.log

